<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobasshera - 15 Days of Love</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium romantic feel -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Floating Hearts Container -->
    <div id="hearts-container"></div>

    <header>
        <h1>Days of Love for Mobasshera</h1>
        <p>Har din ek naya ehsaas, sirf tumhare liye... ❤️</p>
    </header>

    <!-- Main Grid Container for 3D Cards -->
    <main id="letters-container" class="grid-container"></main>

    <!-- 3D Cinematic Lightbox Panel (Modal) -->
    <div id="letter-modal" class="modal">
        <div class="modal-content-wrapper">
            <span class="close-btn">&times;</span>
            <div class="modal-card-3d">
                <div class="modal-header">Day <span id="modal-day-num">1</span></div>
                <div id="modal-letter-text" class="modal-body"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
